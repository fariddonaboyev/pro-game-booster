name: build-windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.10.0 ruff
      - name: Lint
        run: ruff check .
      - name: Build EXE
        run: pyinstaller --noconfirm --onefile --windowed --uac-admin --name PROGameBooster main.py
      - name: Build installer
        shell: pwsh
        run: |
          $env:APP_VERSION = (python -c "import pgb; print(pgb.__version__)")
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: PROGameBooster-Setup
          path: dist/PROGameBooster-Setup.exe
